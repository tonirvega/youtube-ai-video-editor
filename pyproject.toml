[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-ollama"
version = "0.1.0"
description = "Local MVP of three agents using Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ollama>=0.4.0"]

[project.scripts]
multi-agent-ollama = "multi_agent_ollama.main:main"

[tool.setuptools.packages.find]
where = ["src"]
